spring.application.name=API
server.port=8082
# Devuelve el mensaje de error en el JSON (el frontend lo muestra en los toasts)
server.error.include-message=always
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/wearfind?useSSL=false&serverTimezone=America/Argentina/Mendoza&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# JPA & Hibernate
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Seguridad & Autenticación WearFind
# En producción se debe inyectar la variable de entorno JWT_SECRET (mínimo 32 caracteres)
app.security.jwt.secret=${JWT_SECRET:WearFindDevSecretKeyForLocalTestingOnly2026Mendoza}
app.security.jwt.expiration-hours=2

# Modo de entrega de código de activación:
# true: imprime en consola para pruebas locales de desarrollo
# false: entrega exclusiva mediante canal seguro o correo electrónico en producción
app.security.activation.dev-mode=true

# Lista blanca estricta de orígenes permitidos para CORS (sin wildcard ni reflejo arbitrario)
app.security.cors.allowed-origins=http://localhost:8082,http://127.0.0.1:8082,http://localhost:3000