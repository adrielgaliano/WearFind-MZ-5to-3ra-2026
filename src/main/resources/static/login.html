<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar · WearFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">
  <main class="auth-wrap">

    <div class="brand auth-brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>WearFind</h1>
        <span>Armario inteligente</span>
      </div>
    </div>

    <form class="form-card auth-card" id="authForm">
      <div>
        <h2 id="authTitle">Iniciar sesión</h2>
        <p class="muted" id="authSubtitle">Ingresá para ver y administrar tu armario.</p>
      </div>

      <div class="auth-error" id="authError" hidden></div>

      <div class="field" id="usernameField" hidden>
        <label for="username">Username</label>
        <input id="username" type="text" minlength="2" maxlength="50" placeholder="Ej: agalano" autocomplete="username" />
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="usuario@wearfind.com" autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" required minlength="6" maxlength="100" placeholder="Mínimo 6 caracteres" autocomplete="current-password" />
      </div>

      <button class="btn btn-primary auth-submit" type="submit" id="authBtn">
        <span>Ingresar</span>
      </button>

      <p class="auth-alt">
        <span id="authAltText">¿No tenés cuenta?</span>
        <a href="#" class="link" id="authToggle">Creá una</a>
      </p>
    </form>

  </main>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
